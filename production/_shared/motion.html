<!doctype html>
<!-- engine: 5d1e0b7a3c2f4e6a8b9c0d1e2f3a4b5c (bump this only for changes that affect every template; for one template, delete those clips' .key files) -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#EFE7D6;--paper2:#E4D9C2;--ink:#1D1B18;--muted:#5E564A;--red:#A8261B;--gold:#9A7B3C;--blue:#2F5D7C;--rule:#C9BBA0;
    --serif:'Libre Baskerville',Georgia,serif;--sans:'Inter',Arial,sans-serif;--mono:'IBM Plex Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
  body{color:var(--ink);font-family:var(--serif);position:relative}
  #stage{position:absolute;inset:0;transform-origin:50% 50%}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(60,40,10,.20) 100%);z-index:50}
  #grain{position:absolute;inset:0;pointer-events:none;z-index:49;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
  .frame{position:absolute;inset:56px;border:2px solid var(--rule)}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 200px}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:26px;color:var(--muted)}
  .rule{height:4px;background:var(--red);margin:34px auto;width:0}
  h1{font-size:96px;line-height:1.08;font-weight:700}
  h2{font-size:76px;line-height:1.15;font-weight:700}
  .w{display:inline-block;opacity:0;will-change:transform}
  .sub{font-family:var(--serif);font-style:italic;font-size:42px;color:var(--muted);line-height:1.35;opacity:0}
  .bigdate{font-family:var(--serif);font-size:170px;font-weight:700;line-height:1}
  .q{font-family:var(--serif);font-style:italic;font-size:76px;line-height:1.25;max-width:1500px}
  .qm{font-family:var(--serif);font-size:260px;color:var(--red);line-height:.6;height:120px}
  .attr{font-family:var(--sans);font-weight:600;font-size:32px;color:var(--muted);margin-top:44px;letter-spacing:.06em;opacity:0}
  .cols{position:absolute;inset:150px 160px;display:grid;grid-template-columns:1fr 4px 1fr;gap:80px;align-items:center}
  .col h3{font-family:var(--sans);font-weight:800;font-size:58px;margin-bottom:34px}
  .col p{font-family:var(--serif);font-size:46px;line-height:1.45}
  .vr{background:var(--rule);height:0;align-self:center}
  .lower{position:absolute;left:96px;right:96px;bottom:96px;background:rgba(29,27,24,.9);color:#F3ECDD;font-family:var(--serif);font-size:44px;line-height:1.3;padding:22px 34px;border-left:8px solid var(--red);z-index:5}
  .credit{position:absolute;right:70px;bottom:40px;font-family:var(--sans);font-size:20px;color:rgba(243,236,221,.8);text-shadow:0 1px 3px #000;z-index:5}
  .phbox{position:absolute;inset:90px;border:4px dashed #8B8170;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 140px}
  .phtag{font-family:var(--mono);font-size:30px;letter-spacing:.2em;color:#E0B85A}
  .phlabel{font-family:var(--serif);font-size:62px;font-weight:700;margin-top:30px;line-height:1.2;color:#EDE6D6}
  .phsrc{font-family:var(--sans);font-size:28px;color:#B9AF9C;margin-top:34px;line-height:1.5;max-width:1400px}
  .tag{position:absolute;left:80px;bottom:30px;text-align:left;font-family:var(--sans);font-weight:600;font-size:20px;letter-spacing:.08em;color:var(--muted);z-index:6}
  svg text{font-family:var(--sans)}
</style>
</head>
<body>
<div id="stage"></div><div id="grain"></div><div id="vig"></div>
<script>
// ---------- data + helpers ----------
const D = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
const f = D.fields || {};
const DUR = D.dur || 5;
const stage = document.getElementById('stage');
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
const seg = (t,a,b) => clamp((t-a)/Math.max(1e-6,b-a));
const lerp = (a,b,p) => a+(b-a)*p;
const eOut = p => 1-Math.pow(1-p,3);
const eIn = p => p*p*p;
const eIO = p => p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack = p => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2); };
const T = (x,y,s,size=34,anchor='middle',w=600,fill='#1D1B18',extra='') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="${anchor}" fill="${fill}" ${extra}>${esc(s)}</text>`;
const TH = (x,y,s,size=34,anchor='middle',w=800,fill='#1D1B18') => `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="${anchor}" fill="${fill}" stroke="#EFE7D6" stroke-width="9" paint-order="stroke" stroke-linejoin="round">${esc(s)}</text>`;
const words = (s, cls='w') => esc(s).split(/\s+/).map(w=>`<span class="${cls}">${w}</span>`).join(' ');
const drift = (t, amt=.035) => { stage.style.transform = `scale(${1+amt*eIO(clamp(t/DUR))})`; };
// reveal spans in sequence
function revealWords(sel, t, t0, gap=.07, len=.35){ const W=[...document.querySelectorAll(sel)]; W.forEach((w,i)=>{ const p=eOut(seg(t,t0+i*gap,t0+i*gap+len)); w.style.opacity=p; w.style.transform=`translateY(${(1-p)*28}px)`; }); return t0+W.length*gap+len; }
// step semantics: items < step-1 already shown, item step-1 animates in, items >= step ghosted
function stepState(i, n, t, {t0=.15, stagger=.35, len=.5}={}){
  if (f.step){ if (i < f.step-1) return 1; if (i === f.step-1) return eOut(seg(t,t0,t0+len)); return -1; }
  return eOut(seg(t, t0+i*stagger, t0+i*stagger+len));
}
const svgOpen = `<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs>
 <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="24" refY="15" orient="auto"><path d="M0,0 L30,15 L0,30 z" fill="#1D1B18"/></marker>
 <marker id="arR" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="24" refY="15" orient="auto"><path d="M0,0 L30,15 L0,30 z" fill="#A8261B"/></marker>
 <pattern id="stone" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#CDBF9F"/><path d="M0,15 H60 M30,0 V15 M0,0 V0 M15,15 V30 M45,15 V30" stroke="#A8987A" stroke-width="2"/></pattern>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8DB0"/><stop offset="1" stop-color="#2F5D7C"/></linearGradient>
</defs>`;

// ---------- optional faint drifting map behind any card: fields.bgmap = {lat, lon, span, pan:[dLon,dLat], pins:[[lat,lon],...]}
function bgMapSetup(){ const B=f.bgmap; if(!B) return; const k=Math.cos(B.lat*Math.PI/180), sc=1080/(B.span||8);
  const V=[B.lon-1300/(k*sc), B.lon+1300/(k*sc), B.lat-800/sc, B.lat+800/sc]; const data = sc<25?window.LAND110:sc<180?window.LAND50:window.LAND;
  let d=''; for(const r of (data||[])){ let A=1e9,Bx=-1e9,C=1e9,Dd=-1e9; for(let i=0;i<r.length;i+=2){A=Math.min(A,r[i]);Bx=Math.max(Bx,r[i]);C=Math.min(C,r[i+1]);Dd=Math.max(Dd,r[i+1]);} if(Bx<V[0]||A>V[1]||Dd<V[2]||C>V[3]) continue; d+='M'; for(let i=0;i<r.length;i+=2) d+=(i?'L':'')+r[i]+','+r[i+1]; d+='Z'; }
  const el=document.createElement('div'); el.style.cssText='position:absolute;inset:0;z-index:0;opacity:.8';
  el.innerHTML=`<svg width="1920" height="1080"><rect width="1920" height="1080" fill="#CCD6D2"/><g id="bgw"><path d="${d}" fill="#EFE7D6" stroke="#A89A7C" stroke-width="2" vector-effect="non-scaling-stroke"/>${(B.pins||[]).map(q=>`<circle cx="${q[1]}" cy="${q[0]}" r="${14/sc}" fill="#A8261B" opacity=".7"/>`).join('')}</g></svg>`;
  stage.insertBefore(el, stage.firstChild); [...stage.children].slice(1).forEach(c=>{ if(!c.style.position) c.style.position='absolute'; c.style.zIndex=1; });
  const g=el.querySelector('#bgw'); const pan=B.pan||[0.6/k*(B.span||8)/8,0];
  window._bg=t=>{ const q=clamp(t/DUR); const lon=B.lon+pan[0]*q, lat=B.lat+pan[1]*q; g.setAttribute('transform',`matrix(${k*sc},0,0,${-sc},${960-lon*k*sc},${540+lat*sc})`); };
  // a soft paper panel so the words stay readable
  const pn=document.createElement('div'); pn.style.cssText='position:absolute;left:160px;right:160px;top:250px;bottom:250px;background:radial-gradient(ellipse at center,rgba(239,231,214,.95) 50%,rgba(239,231,214,0) 78%);z-index:0'; stage.insertBefore(pn, el.nextSibling);
}
// ---------- always-on time bar: D.timebar = {range:[a,b], marks:[[year,label],...], from, to}
function timebarSetup(){ const B=D.timebar; if(!B) return; const el=document.createElement('div'); el.id='tbar';
  el.style.cssText='position:absolute;left:0;right:0;top:0;height:74px;z-index:60;pointer-events:none';
  el.innerHTML='<svg width="1920" height="74"><g id="tbg"></g></svg>'; document.body.appendChild(el); }
function timebarDraw(t){ const B=D.timebar; if(!B) return; const g=document.getElementById('tbg'); const [a,b]=B.range; const x0=150,x1=1770;
  // B.scale (optional): piecewise [[year, 0..1],...] for spans with long empty gaps; B.ticks (optional): explicit tick years. Negative years are BC.
  const S=B.scale; const F=y=>{ if(!S) return (y-a)/(b-a); if(y<=S[0][0]) return S[0][1]; for(let k=1;k<S.length;k++) if(y<=S[k][0]) return lerp(S[k-1][1],S[k][1],(y-S[k-1][0])/(S[k][0]-S[k-1][0])); return S[S.length-1][1]; };
  const X=y=>x0+F(y)*(x1-x0); const yl=y=>y<0?`${-y} BC`:String(y);
  const from=B.from??B.to, to=B.to; const cur = to==null ? null : lerp(from??to,to,eIO(seg(t,0,.8)));
  let o=`<rect x="0" y="0" width="1920" height="74" fill="#EFE7D6" opacity=".93"/><line x1="0" y1="74" x2="1920" y2="74" stroke="#C9BBA0" stroke-width="2"/>
   <line x1="${x0}" y1="40" x2="${x1}" y2="40" stroke="#8B8170" stroke-width="3"/>`;
  const ticks = B.ticks || (()=>{ const r=[]; for(let y=Math.ceil(a/10)*10;y<=b;y+=10) r.push(y); return r; })();
  ticks.forEach(y=>{ o+=`<line x1="${X(y)}" y1="34" x2="${X(y)}" y2="46" stroke="#8B8170" stroke-width="2"/>`+(cur!=null&&Math.abs(X(y)-X(cur))<Math.max(62,(B.label||yl(Math.round(cur))).length*6+46)?'':`<text x="${X(y)}" y="66" font-size="17" font-weight="600" text-anchor="middle" fill="#7A6E5C">${yl(y)}</text>`); });
  (B.gaps||[]).forEach(y=>{ const x=X(y); o+=`<rect x="${x-9}" y="30" width="18" height="20" fill="#EFE7D6"/><line x1="${x-9}" y1="48" x2="${x-1}" y2="32" stroke="#8B8170" stroke-width="2.5"/><line x1="${x+1}" y1="48" x2="${x+9}" y2="32" stroke="#8B8170" stroke-width="2.5"/>`; });
  if (cur!=null) o+=`<rect x="${x0}" y="37" width="${Math.max(0,X(cur)-x0)}" height="6" fill="#A8261B" opacity=".55"/>`;
  (B.marks||[]).forEach(([y,l,anc])=>{ const past = cur!=null && y<=cur+0.01; const xa = anc==='end'?X(y)+6:anc==='start'?X(y)-6:X(y); o+=`<circle cx="${X(y)}" cy="40" r="7" fill="${past?'#1D1B18':'#EFE7D6'}" stroke="#1D1B18" stroke-width="2.5"/><text x="${xa}" y="24" font-size="16" font-weight="700" text-anchor="${anc||'middle'}" fill="${past?'#1D1B18':'#9A8F7C'}">${esc(l)}</text>`; });
  if (cur!=null){ const xc=X(cur), lab=B.label||yl(Math.round(cur)), w=Math.max(68,lab.length*12+16); o+=`<g transform="translate(${xc},40)"><circle r="12" fill="#A8261B" stroke="#EFE7D6" stroke-width="3"/></g><g transform="translate(${Math.min(1850,Math.max(70,xc))},0)"><rect x="${-w/2}" y="47" width="${w}" height="24" rx="5" fill="#A8261B"/><text x="0" y="65" font-size="18" font-weight="800" text-anchor="middle" fill="#EFE7D6">${lab}</text></g>`; }
  g.innerHTML=o; }
// ---------- templates ----------
const TPL = {};

TPL.title = {
  setup(){ stage.innerHTML = `<div class="frame"></div><div class="center"><div class="kicker" id="k">Somebody Did It First</div><div class="rule" id="r"></div><h1>${words(f.title)}</h1>${f.subtitle?`<div class="sub" id="s" style="margin-top:28px">${esc(f.subtitle)}</div>`:''}</div>`; },
  draw(t){ drift(t,.03); k.style.opacity=eOut(seg(t,0,.5)); r.style.width=120*eOut(seg(t,.15,.8))+'px'; const e=revealWords('h1 .w',t,.3,.09,.45); const s=document.getElementById('s'); if(s) s.style.opacity=eOut(seg(t,e,e+.5)); }
};

TPL.text = {
  setup(){ stage.innerHTML = `<div class="frame"></div><div class="center"><h2>${words(f.headline)}</h2>${f.sub?`<div class="rule" id="r"></div><div class="sub" id="s">${esc(f.sub)}</div>`:''}</div>`; },
  draw(t){ drift(t,.04); const e=revealWords('h2 .w',t,.05,.06,.35); const r=document.getElementById('r'); if(r){ r.style.width=120*eOut(seg(t,e-.1,e+.4))+'px'; s.style.opacity=eOut(seg(t,e+.1,e+.6)); } }
};

TPL.endcard = {
  setup(){ stage.innerHTML = `<div class="frame"></div><div class="center"><div class="kicker" id="k">Somebody Did It First</div><div class="rule" id="r"></div><h2 id="h">${esc(f.line)}</h2></div>`; },
  draw(t){ drift(t,.03); k.style.opacity=eOut(seg(t,.6,1.1)); r.style.width=160*eOut(seg(t,.4,1))+'px'; const p=seg(t,0,.45); h.style.transform=`scale(${lerp(1.5,1,eBack(p))}) rotate(${lerp(-5,0,eOut(p))}deg)`; h.style.opacity=eOut(seg(t,0,.25)); }
};

function countable(s){ const m=String(s).match(/^(\D*?)(\d[\d,]*)(\D*)$/); if(!m) return null; const v=+m[2].replace(/,/g,''); if (v>=1000 && v<=2100 && !/,/.test(m[2])) return null; return {pre:m[1],v,post:m[3],comma:/,/.test(m[2])}; }
TPL.date = {
  setup(){ stage.innerHTML = `<div class="frame"></div><div class="center"><div class="bigdate" id="d">${esc(f.date||f.number)}</div><div class="rule" id="r"></div><div class="sub" id="s" style="font-style:normal;color:var(--ink)">${esc(f.caption||f.label||'')}</div>${f.sub?`<div class="sub" id="s2" style="font-size:34px;margin-top:14px">${esc(f.sub)}</div>`:''}</div>`; this.c=countable(f.date||f.number); },
  draw(t){ drift(t,.035); const p=seg(t,0,.5);
    if (this.c && D.template==='stat'){ const v=Math.round(this.c.v*eOut(seg(t,0,1.1))); d.textContent=this.c.pre+(this.c.comma?v.toLocaleString('en-US'):v)+this.c.post; d.style.opacity=eOut(seg(t,0,.2)); }
    else { d.style.transform=`scale(${lerp(1.6,1,eBack(p))}) rotate(${lerp(-4,0,eOut(p))}deg)`; d.style.opacity=eOut(seg(t,0,.2)); }
    r.style.width=120*eOut(seg(t,.4,.9))+'px'; s.style.opacity=eOut(seg(t,.55,1.05)); const s2=document.getElementById('s2'); if(s2) s2.style.opacity=eOut(seg(t,.8,1.3)); }
};
TPL.stat = { setup(){ TPL.date.setup.call(this); this.c=countable(f.number); d.style.color='var(--red)'; }, draw(t){ TPL.date.draw.call(this,t); } };

TPL.quote = {
  setup(){ stage.innerHTML = `<div class="frame"></div><div class="center"><div class="qm" id="qm">“</div><div class="q">${words(f.quote)}</div><div class="attr" id="a">${esc(f.attribution)}</div></div>`; },
  draw(t){ drift(t,.03); qm.style.opacity=eOut(seg(t,0,.3)); qm.style.transform=`scale(${lerp(.6,1,eBack(seg(t,0,.4)))})`; const n=document.querySelectorAll('.q .w').length; const gap=Math.min(.16,(DUR*.55)/Math.max(1,n)); const e=revealWords('.q .w',t,.25,gap,.3); a.style.opacity=eOut(seg(t,e,e+.5)); }
};

TPL.compare = {
  setup(){ stage.innerHTML = `<div class="cols"><div class="col" id="L"><h3>${esc(f.left_title)}</h3>${(f.left_lines||[]).map(l=>`<p>${esc(l)}</p>`).join('')}</div><div class="vr" id="V"></div><div class="col" id="R"><h3>${esc(f.right_title)}</h3>${(f.right_lines||[]).map(l=>`<p>${esc(l)}</p>`).join('')}</div></div>`; },
  draw(t){ drift(t,.03);
    const lp = f.step===2 ? 1 : eOut(seg(t,0,.55)); L.style.opacity=lp; L.style.transform=`translateX(${(1-lp)*-60}px)`;
    V.style.height = (f.step===2?70:70*eOut(seg(t,.2,.8)))+'%';
    let rp; if (f.step===1) rp = .13*eOut(seg(t,.4,.9)); else if (f.step===2) rp = lerp(.13,1,eOut(seg(t,.1,.7))); else rp = eOut(seg(t,.6,1.15));
    R.style.opacity=rp; R.style.transform=`translateX(${(1-Math.min(1,rp/ (f.step===1?.13:1)))*60}px)`; }
};

TPL.datecard = {
  setup(){ stage.innerHTML = svgOpen+`<g id="g"></g></svg>`; },
  draw(t){ drift(t,.03); const x0=330,x1=1590,y=600;
    const lp=eOut(seg(t,.1,1.0)); const pinL=eBack(seg(t,.05,.45)), pinR=eBack(seg(t,.9,1.3)); const gp=eOut(seg(t,1.2,1.7));
    const ll=eOut(seg(t,.2,.6)), rl=eOut(seg(t,1.0,1.4));
    g.innerHTML = `${T(960,170,(f.kicker||'').toUpperCase(),28,'middle',600,'#5E564A','letter-spacing="7"')}
      <line x1="${x0}" y1="${y}" x2="${lerp(x0,x1,lp)}" y2="${y}" stroke="#1D1B18" stroke-width="6"/>
      <circle cx="${x0}" cy="${y}" r="${26*pinL}" fill="#A8261B"/>
      <circle cx="${x1}" cy="${y}" r="${26*pinR}" fill="#EFE7D6" stroke="#1D1B18" stroke-width="6" opacity="${pinR>0?1:0}"/>
      <g opacity="${ll}" transform="translate(0,${(1-ll)*20})">${T(x0-40,y-150,f.left_label,38,'start',800)}${T(x0-40,y-70,f.left_date,66,'start',700,'#1D1B18','font-family="Libre Baskerville"')}</g>
      <g opacity="${rl}" transform="translate(0,${(1-rl)*20})">${T(x1+40,y-150,f.right_label,38,'end',800)}${T(x1+40,y-70,f.right_date,66,'end',700,'#1D1B18','font-family="Libre Baskerville"')}</g>
      <g opacity="${gp}"><path d="M${x0},${y+60} v20 H${x1} v-20" fill="none" stroke="#A8261B" stroke-width="4"/>${T(960,y+150,(f.gap||'').toUpperCase(),50,'middle',900,'#A8261B','letter-spacing="4"')}</g>`; }
};

TPL.flow = {
  setup(){ stage.innerHTML = svgOpen+`<g id="g"></g></svg>`; this.n=(f.steps||[]).length; },
  draw(t){ drift(t,.03); const st=f.steps||[], n=st.length; const G=f.arrows===false?50:70; const W=Math.min(500,(1760-(n-1)*G)/n); const x0=(1920-(n*W+(n-1)*G))/2;
    const fl=W>=420?42:W>=330?36:30, fs=W>=420?30:W>=330?27:23; let out=T(960,170,(f.title||'').toUpperCase(),40,'middle',800);
    st.forEach((s,i)=>{ const x=x0+i*(W+G); let p=stepState(i,n,t,{t0:.15,stagger:Math.min(.5,(DUR*.5)/n)}); const ghost=p<0; const vis=ghost?.13:p; const sc=ghost?1:lerp(.8,1,eBack(Math.max(0,p)));
      const hi=f.highlight===i && !ghost; const pulse=hi?(1+.03*Math.sin(t*5)):1;
      out+=`<g opacity="${vis}" transform="translate(${x+W/2},520) scale(${sc*pulse}) translate(${-(x+W/2)},-520)"><rect x="${x}" y="390" width="${W}" height="260" rx="14" fill="${hi?'#F2C14E':'#EFE7D6'}" stroke="#1D1B18" stroke-width="5"/>

    if(r>0) for(let i=0;i<8;i++){ const y=330+((t*500+i*48)%380); s+=`<rect x="1452" y="${y}" width="20" height="18" fill="#5B8DB0"/>`; } }
  if(mode==='pour'||mode==='both'){ const q=eOut(seg(t,at(P,'pour',.6),at(P,'pour',.6)+.6)); s+=`<g transform="translate(1100,${500-40*q}) rotate(${q*60})"><path d="M-40,-60 h80 l-10,120 h-60 z" fill="#B87333" stroke="#1D1B18" stroke-width="5"/></g>`; if(q>.9) for(let i=0;i<6;i++){ const y=520+((t*500+i*20)%100); s+=`<rect x="1180" y="${y}" width="16" height="14" fill="#5B8DB0"/>`; } }
  const fl=seg(t,at(P,'flow',1.0),DUR); if(fl>0) for(let i=0;i<14;i++){ const x=1700-((t*400+i*110)%1480); s+=`<rect x="${x}" y="808" width="44" height="22" rx="8" fill="#5B8DB0" opacity=".9"/>`; }
  if (mode==='pour') s+=callout(t,at(P,'c1',1.2),1130,470,1560,520,'or somebody poured water in');
  else s+=callout(t,at(P,'c1',1.2),1462,420,1580,560,'rainwater from the roof');
  s+=callout(t,at(P,'c2',2.2),900,820,560,690,'flushed into a stone sewer','end');
  return s; };

SC.ripple = (t,P) => { let s=titleBar(t,P.title||'Public versus first'); const rr=at(P,'right',0); const rq=eOut(seg(t,rr,rr+.5));
  const one=!!P.single; const A=one?[960,560]:[560,560], B=[1360,560]; const dots=one?[[520,330],[700,850],[1300,300],[1420,800],[460,620],[1500,560],[960,250],[1180,880]]:[[300,330],[420,820],[760,300],[820,830],[300,600],[700,640]];
  for(let i=0;i<4;i++){ const q=((t*.45+i/4)%1); s+=`<circle cx="${A[0]}" cy="${A[1]}" r="${30+q*(one?620:360)}" fill="none" stroke="#A8261B" stroke-width="5" opacity="${(1-q)*.7}"/>`; }
  dots.forEach(([x,y],i)=>{ const d=Math.hypot(x-A[0],y-A[1]); const lit=t*.45*(one?620:360)>d-30; s+=`<circle cx="${x}" cy="${y}" r="16" fill="${lit?'#A8261B':'#C9BBA0'}"/>`; });
  s+=`<circle cx="${A[0]}" cy="${A[1]}" r="34" fill="#A8261B"/>` + (one ? `<rect x="560" y="905" width="800" height="120" rx="12" fill="#EFE7D6" opacity=".92"/>${T(960,955,P.left||'',46,'middle',800)}${T(960,1003,P.leftSub||'',32,'middle',600,'#4A443A')}` : `${TH(A[0],A[1]+90,P.left||'Boston, 1846',40,'middle',800)}${TH(A[0],A[1]+135,P.leftSub||'in public: written down, talked about, copied',28,'middle',600,'#5E564A')}`);
  if(one) return s;
  s+=`<line x1="960" y1="260" x2="960" y2="880" stroke="#C9BBA0" stroke-width="4"/>`;
  s+=`<g opacity="${rq}"><circle cx="${B[0]}" cy="${B[1]}" r="34" fill="#1D1B18"/>${TH(B[0],B[1]+90,P.right||'Georgia, 1842',40,'middle',800)}${TH(B[0],B[1]+135,P.rightSub||'not published until 1849',28,'middle',600,'#5E564A')}</g>`;
  [[1150,330],[1600,320],[1180,820],[1620,800],[1700,560]].forEach(([x,y])=>{ s+=`<circle cx="${x}" cy="${y}" r="16" fill="#C9BBA0"/>`; });
  return s; };

SC.anesthesia = (t,P) => { let s=titleBar(t,P.title||'Numbed in one spot, or completely out');
  const head=(x,awake,glow)=>`<g transform="translate(${x},560)"><circle cx="0" cy="-120" r="110" fill="#E4D9C2" stroke="#1D1B18" stroke-width="7"/>
   ${awake?`<circle cx="-38" cy="-130" r="12" fill="#1D1B18"/><circle cx="38" cy="-130" r="12" fill="#1D1B18"/><path d="M-30,-70 q30,16 60,0" fill="none" stroke="#1D1B18" stroke-width="6"/>`:`<path d="M-58,-128 q20,14 40,0 M18,-128 q20,14 40,0" fill="none" stroke="#1D1B18" stroke-width="7"/><path d="M-26,-66 h52" stroke="#1D1B18" stroke-width="6"/>`}
   <path d="M-190,190 C-190,40 190,40 190,190" fill="#E4D9C2" stroke="#1D1B18" stroke-width="7"/>${glow||''}</g>`;
  const L0=at(P,'left',0), R0=at(P,'right',1.2); const g1=eOut(seg(t,L0+.5,L0+1.1)); s+=`<g opacity="${eOut(seg(t,L0,L0+.5))}">${head(560,true,`<circle cx="120" cy="120" r="${40+8*Math.sin(t*5)}" fill="#F2C14E" opacity="${.8*g1}"/>`)}${T(560,880,'numbed in one spot',44,'middle',800)}</g>`;
  const g2=eOut(seg(t,R0,R0+.6)); s+=`<g opacity="${g2}">${head(1360,false,'')}<g opacity="${.5+.5*Math.sin(t*3)}">${T(1500,-0+330,'z',60,'middle',900,'#2F5D7C')}${T(1550,280,'z',80,'middle',900,'#2F5D7C')}</g>${T(1360,880,'completely out: full general anesthesia',44,'middle',800,'#A8261B')}</g>`;
  return s; };

SC.herbal = (t,P) => { let s=titleBar(t,P.title||'An herbal mix'); const q=eOut(seg(t,0,.6));
  s+=`<g transform="translate(960,${600+(1-q)*40})" opacity="${q}"><path d="M-220,-60 H220 C220,120 120,200 0,200 C-120,200 -220,120 -220,-60 Z" fill="#CFC09F" stroke="#1D1B18" stroke-width="8"/>
   <g transform="rotate(${-30+8*Math.sin(t*3)}) translate(80,-160)"><rect x="-26" y="-180" width="52" height="260" rx="26" fill="#9A7B3C" stroke="#1D1B18" stroke-width="7"/></g>
   ${[[-150,-80],[-60,-100],[60,-90],[150,-70],[0,-120]].map(([x,y],i)=>`<ellipse cx="${x}" cy="${y-30*Math.sin(t*2+i)}" rx="34" ry="14" fill="#3F7A45" transform="rotate(${i*40} ${x} ${y})" opacity="${eOut(seg(t,.4+i*.15,.9+i*.15))}"/>`).join('')}</g>`;
  if(P.caption) s+=`<g opacity="${eOut(seg(t,.8,1.3))}">${T(960,960,P.caption,46,'middle',800)}</g>`;
  return s; };

// ---------- boot ----------
const tpl = TPL[D.template] || TPL.text;
const loadJS = src => new Promise(r=>{ const e=document.createElement('script'); e.src=src; e.onload=r; e.onerror=r; document.head.appendChild(e); });
(async()=>{ if (D.template==='pinmap' || f.bgmap){ await loadJS('land110.js'); await loadJS('land50.js'); await loadJS('land.js'); await loadJS('geo2.js'); }
  tpl.setup.call(tpl); if (f.bgmap && D.template!=='pinmap') bgMapSetup(); timebarSetup(); window.drawAt = s => { tpl.draw.call(tpl, s); if (window._bg) window._bg(s); timebarDraw(s); };
  await document.fonts.ready; window.drawAt(0); document.body.setAttribute('data-ready','1'); })();
</script>
