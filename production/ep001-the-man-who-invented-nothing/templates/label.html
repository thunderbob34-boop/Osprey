<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1920px;height:1080px;background:transparent}
.l{position:absolute;top:40px;left:40px;background:rgba(20,18,15,.82);color:#F3ECDD;font:600 26px Inter,Arial;padding:10px 18px;letter-spacing:.04em}
.l b{color:#E0B85A;font-weight:800;margin-right:10px}</style></head>
<body><div class="l" id="l"></div><script>
const d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));document.getElementById('l').innerHTML='<b>'+d.num+'</b>'+d.name;
document.fonts.ready.then(()=>document.body.setAttribute('data-ready','1'))</script></body></html>
